name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and pack without publishing'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the full check suite
        run: npm run check

      - name: Build
        run: npm run build

      - name: Confirm the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "Tag and package version agree: $pkg"

      # The release body is the changelog section, so a tag with no section must
      # not publish. The Version workflow checks this before it tags; a tag
      # pushed by hand bypasses that, and this is where it gets caught.
      - name: Confirm the changelog has notes for this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-notes.ts "${GITHUB_REF_NAME#v}" > /dev/null

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
    environment: npm-publish
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC) and provenance.
      id-token: write
    env:
      # Single source of truth for the pinned client, so the install and the
      # assertion below cannot drift apart.
      NPM_VERSION: '11.19.0'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No dependency cache in this job. It holds `id-token: write`, so a
      # poisoned cache entry would execute where a publish can be triggered.
      # `package-manager-cache` defaults to true, so it must be disabled
      # explicitly -- omitting `cache` alone still caches.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer. Pinned rather than
      # `@latest`: this job can publish, so the npm client it runs should be an
      # explicit, reviewable choice rather than whatever shipped today.
      # `--ignore-scripts` keeps lifecycle hooks from executing in a job that
      # holds `id-token: write`, and the assertion turns a pin that silently
      # failed to apply into a loud failure instead of a surprise client.
      - name: Install the pinned npm client
        run: |
          npm install -g --ignore-scripts "npm@${NPM_VERSION}"
          installed="$(npm --version)"
          if [ "$installed" != "$NPM_VERSION" ]; then
            echo "::error::Expected npm $NPM_VERSION but found $installed"
            exit 1
          fi
          echo "npm $installed confirmed"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # No token and no secret: npm trusts this repository and workflow
      # directly, and GitHub mints a short-lived OIDC credential per run.
      # Provenance is attested automatically under trusted publishing.
      - name: Publish
        run: npm publish --access public

  announce:
    name: Create the GitHub release
    # Only after npm has the package: a release page pointing at a version
    # nobody can install is worse than no page yet.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # Creating a release writes to the repository.
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The notes are hand-written in CHANGELOG.md, and `verify` has already
      # refused the tag if that section is missing. Extraction failing here is
      # a real error, not a reason to invent notes from pull-request titles.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::Release $tag already exists"
            exit 0
          fi

          notes="$(mktemp)"
          node scripts/release-notes.ts "$version" > "$notes"
          gh release create "$tag" --verify-tag --title "v$version" --notes-file "$notes"
