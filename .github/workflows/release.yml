name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and pack without publishing'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the full check suite
        run: npm run check

      - name: Build
        run: npm run build

      - name: Confirm the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "Tag and package version agree: $pkg"

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
    environment: npm-publish
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC) and provenance.
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No dependency cache in this job. It holds `id-token: write`, so a
      # poisoned cache entry would execute where a publish can be triggered.
      # `package-manager-cache` defaults to true, so it must be disabled
      # explicitly -- omitting `cache` alone still caches.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer. Pinned rather than
      # `@latest`: this job can publish, so the npm client it runs should be an
      # explicit, reviewable choice rather than whatever shipped today.
      - name: Install the pinned npm client
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # No token and no secret: npm trusts this repository and workflow
      # directly, and GitHub mints a short-lived OIDC credential per run.
      # Provenance is attested automatically under trusted publishing.
      - name: Publish
        run: npm publish --access public
